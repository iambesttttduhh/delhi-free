name: Daily rebuild

# Keeps the event pages honest without anyone pressing anything.
# An event that ended yesterday should not still look live tomorrow morning,
# so this regenerates the pages from events.json every night and commits the
# result if anything actually changed.

on:
  schedule:
    # 00:20 IST — after midnight in Delhi, before most people look
    - cron: "50 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate every event page and the sitemap
        run: python build_event_pages.py events.json . --asset-base "../../"

      - name: Commit only if the pages actually changed
        run: |
          git config user.name "delhi-free rebuild"
          git config user.email "actions@users.noreply.github.com"
          git add events sitemap.xml
          if git diff --cached --quiet; then
            echo "Nothing changed today — no commit."
          else
            git commit -m "Daily rebuild: run states and dates refreshed"
            git push
          fi
