name: Close the site for good

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DELETE (capital letters) to confirm. This cannot be undone."
        required: true

permissions:
  contents: write
  pages: write

jobs:
  close:
    if: ${{ inputs.confirm == 'DELETE' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpublish and wipe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          gh api -X DELETE "repos/$REPO/pages" || true

          find . -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name .github -exec rm -rf {} +

          cat > index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Closed</title>
          <body style="font-family:system-ui;padding:3rem">
          <h1>This site has been closed.</h1>
          </body>
          HTML

          git add -A
          git -c user.name="site-switch" -c user.email="noreply@github.com" \
              commit -q -m "Close the site permanently" || true
          git push
          echo "CONTENT WIPED and site unpublished. To remove the repository itself,"
          echo "delete it in Settings — that needs your own token, not this one."
